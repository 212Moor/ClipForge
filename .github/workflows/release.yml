name: Release Windows (NSIS + mises à jour Tauri)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les dépendances front
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install --no-audit --no-fund }

      - name: Vérifier TypeScript et construire le front
        run: npm run build

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test

      - name: Construire l'installeur NSIS et signer les artefacts de mise à jour
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ClipForge ${{ github.ref_name }}"
          releaseBody: "Installeur Windows NSIS et artefacts signés pour la mise à jour automatique."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Signer et publier le manifeste des sidecars
        if: env.MANIFEST_SIGNING_KEY != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/manifest-sign.mjs sign src-tauri/resources/sidecars-manifest.json
          gh release upload "${{ github.ref_name }}" \
            src-tauri/resources/sidecars-manifest.json \
            src-tauri/resources/sidecars-manifest.json.sig \
            --clobber
